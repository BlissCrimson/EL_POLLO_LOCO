<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EL POLLO LOCO</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css" />
  <!-- Basisclasses -->
  <script src="models/drawable-object.class.js"></script>
  <script src="models/movable-object.class.js"></script>
  <script src="models/throwable-object.class.js"></script>
  <script src="models/background-object.class.js"></script>
  <script src="models/character.class.js"></script>
  <script src="models/bottle.class.js"></script>
  <script src="models/coin.class.js"></script>
  <script src="models/chicken.class.js"></script>
  <script src="models/chicken-small.class.js"></script>
  <script src="models/chicken-boss.class.js"></script>
  <script src="models/cloud.class.js"></script>
  <script src="models/Keyboard.class.js"></script>
  <script src="models/status-bar.class.js"></script>
  <script src="models/status-boss.class.js"></script>
  <script src="models/status-bar-bottle.class.js"></script>
  <script src="models/status-bar-coins.class.js"></script>
  <script src="models/status-bar-health.class.js"></script>
  <!-- Level -->
  <script src="models/startScreen.class.js"></script>
  <script src="models/level.class.js"></script>
  <script src="levels/lvl1.js"></script>
  <!-- World -->
  <script src="models/world.class.js"></script>
  <script src="js/game.js"></script>
</head>

<body>
  <!-- <body onload="init()"> -->

  <h1>EL POLLO LOCO</h1>
  <div class="game-wrapper">
    <div id="startScreen" class="start-screen">
      <button id="startGame" class="button button__play">
        <img class="button button__img" src="./assets/icons/play.svg" alt="">
        PLAY
      </button>
      <button id="openDialog" class="button button__instructions" onclick="openDialog('controlls')">
        <img class="button__img" src="./assets/icons/controlls.svg" alt="">
        CONTROLLS
      </button>
      <button id="stettings" class="button button__settings" onclick="openDialog('settings')">
        <img class="button__img" src="./assets/icons/settings.svg" alt="">
        SETTINGS
      </button>
    </div>

    <canvas id="canvas" class="d_none" width="720px" height="480px">
      <!-- <canvas id="canvas" width="720px" height="480px"> -->

    </canvas>

    <dialog id="controllsDialog">
      <header>
        <h2><img class="button__img" src="./assets/icons/controlls.svg" alt="">CONTROLLS</h2>
      </header>
      <main>
        <table>
          <thead>
            <tr>
              <th>Controll</th>
              <th>Key First</th>
              <th>Key Second</th>
            </tr>
          </thead>
          <tr>
            <td>Jump</td>
            <td>W</td>
            <td>UP</td>
          </tr>
          <tr>
            <td>Walk Left</td>
            <td>A</td>
            <td>LEFT</td>
          </tr>
          <tr>
            <td>Walk Right</td>
            <td>D</td>
            <td>Right</td>
          </tr>
          <tr>
            <td>Attack</td>
            <td>S</td>
            <td>Down</td>
          </tr>
        </table>
      </main>
      <footer>
        <button id="closeDialog" onclick="closeDialog()">X</button>
      </footer>
    </dialog>

    <dialog id="settingsDialog">
      <header>
        <h2><img class="button__img" src="./assets/icons/settings.svg" alt="">SETTINGS</h2>
      </header>
      <main>

      </main>
      <footer>
        <button id="closeDialog" onclick="closeDialog()">X</button>
      </footer>
    </dialog>

    <dialog id="impressum">
      <header class="impressum__header">
        <h2>IMPRESSUM</h2>
      </header>
      <main class="impressum__main">
        <div
          style="min-width: 70vh;max-width: 80vh; min-height: 70vh; max-height: 80vh; border: 8px solid #7c5e25; background-color: #cc942b; border-radius: 8px;">

        </div>
      </main>
      <footer class="impressum__footer" style="text-align: center;">
        <h3>
          EL POLLO LOCO <br>
          by <br>
          Matthias Tausch
        </h3>
      </footer>
    </dialog>

    <div id="endScreen" class="d_none">
      <img src="./assets/img/5_background/canyon.background.png" alt="" srcset="">
      <button onclick="restartGame()">
        restart
      </button>
      <button onclick="showHomeScreen()">
        Home
      </button>
    </div>
  </div>
</body>

</html>
