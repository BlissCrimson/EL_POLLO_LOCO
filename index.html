<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EL POLLO LOCO</title>
  <link rel="shortcut icon" href="./assets/img/favicon-elpolloloco.png" type="image/x-icon">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css" />
  <!-- Basisclasses -->
  <script src="models/drawable-object.class.js"></script>
  <script src="models/movable-object.class.js"></script>
  <script src="models/throwable-object.class.js"></script>
  <script src="models/sound-manager.class.js"></script>
  <script src="models/background-object.class.js"></script>
  <script src="models/character.class.js"></script>
  <script src="models/bottle.class.js"></script>
  <script src="models/coin.class.js"></script>
  <script src="models/chicken.class.js"></script>
  <script src="models/chicken-small.class.js"></script>
  <script src="models/chicken-boss.class.js"></script>
  <script src="models/cloud.class.js"></script>
  <script src="models/Keyboard.class.js"></script>
  <script src="models/status-bar.class.js"></script>
  <script src="models/status-boss.class.js"></script>
  <script src="models/status-bar-bottle.class.js"></script>
  <script src="models/status-bar-coins.class.js"></script>
  <script src="models/status-bar-health.class.js"></script>
  <!-- Level -->
  <script src="models/startScreen.class.js"></script>
  <script src="models/level.class.js"></script>
  <script src="levels/lvl1.js"></script>
  <!-- World -->
  <script src="models/world.class.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/game.js" defer></script>
</head>

<body>
  <!-- <body onload="init()"> -->

  <h1>EL POLLO LOCO</h1>
  <div class="game-wrapper">
    <div id="startScreen" class="start-screen">
      <button id="muteButton" class="button button__mute" onclick="toggleMute()">
        <img id="muteIcon" class="button button__img" src="" alt="">
      </button>
      <button id="startGame" class="button button__play">
        <img class="button button__img" src="./assets/icons/play.svg" alt="">
        PLAY
      </button>
      <button id="controlls" class="button button__instructions" onclick="openDialog('controlls')">
        <img class="button__img" src="./assets/icons/controlls.svg" alt="">
        CONTROLLS
      </button>
      <button id="stettings" class="button button__settings" onclick="openDialog('settings')">
        <img class="button__img" src="./assets/icons/settings.svg" alt="">
        SETTINGS
      </button>
    </div>
    <!-- mobile Buttons -->
    <button id="buttonLeft" class="button button__mobile button__mobile--left" data-key="A">
      <img class="icon__mobile icon__mobile--left" src="./assets/icons/arrow.png" alt="">
    </button>
    <button id="buttonRight" class="button button__mobile button__mobile--right" data-key="D">
      <img class="icon__mobile icon__mobile--right" src="./assets/icons/arrow.png" alt="">
    </button>
    <button id="buttonJump" class="button button__mobile button__mobile--jump" data-key="W">
      <img class="icon__mobile icon__mobile--up" src="./assets/icons/arrow.png" alt="">
    </button>
    <button id="buttonAttack" class="button button__mobile button__mobile--attack" data-key="S">
      <img class="icon__mobile icon__mobile--attack" src="./assets/icons/arrow__attack.png" alt="">
    </button>

    <canvas id="canvas" class="d_none" width="720px" height="480px">
      <!-- <canvas id="canvas" width="720px" height="480px"> -->

    </canvas>

    <dialog id="dialogContent">
      <header>
        <h2 id="dialogTitle"></h2>
      </header>
      <main id="dialogMain"></main>
      <footer>
        <button id="closeDialog" onclick="closeDialog()">X</button>
      </footer>
    </dialog>

    <div id="endScreen" class="endscreen d_none">
      <img id="endScreenImg" class="endscreeen endscreen__background" src="" alt="" srcset="">
      <img id="resultImg" class="endscreen endscreen__result" src="" alt="">
      <button onclick="restartGame()">
        restart
      </button>
      <button onclick="showHomeScreen()">
        Home
      </button>
    </div>
  </div>

  <div id="rotateHint">
    <p>Turn your device to play</p>
  </div>
</body>

</html>
